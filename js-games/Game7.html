<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enhanced Physics Sandbox</title>
  <style>
    body { margin: 0; overflow: hidden; background: #222; }
    #toolbox {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      background: rgba(255,255,255,0.1); padding: 10px; border-radius: 5px;
    }
    button, input { margin: 5px; padding: 5px 10px; }
    label { color: white; }
  </style>
</head>
<body>

<div id="toolbox">
  <button onclick="addBox()">Add Box</button>
  <button onclick="addBall()">Add Ball</button>
  <button onclick="addTriangle()">Add Triangle</button>
  <button onclick="addPolygon()">Add Polygon</button>
  <button onclick="resetScene()">Reset</button>
  <button onclick="toggleWireframes()">Toggle Wireframes</button>
  <br>
  <label>Gravity:</label>
  <input type="range" min="-1" max="2" step="0.1" value="1" id="gravitySlider">
  <br>
  <label>Bounciness:</label>
  <input type="range" min="0" max="1" step="0.05" value="0.5" id="restitutionSlider">
</div>

<canvas id="sandbox"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const { Engine, Render, World, Bodies, Mouse, MouseConstraint, Composite } = Matter;

const engine = Engine.create();
const world = engine.world;

// Create renderer
const canvas = document.getElementById('sandbox');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const render = Render.create({
  canvas: canvas,
  engine: engine,
  options: {
    wireframes: false,
    background: '#222',
    width: canvas.width,
    height: canvas.height
  }
});

Render.run(render);
Engine.run(engine);

// Ground and walls
const ground = Bodies.rectangle(canvas.width/2, canvas.height-20, canvas.width, 40, { isStatic: true, render: { fillStyle: '#555' } });
const leftWall = Bodies.rectangle(-20, canvas.height/2, 40, canvas.height, { isStatic: true });
const rightWall = Bodies.rectangle(canvas.width+20, canvas.height/2, 40, canvas.height, { isStatic: true });
World.add(world, [ground, leftWall, rightWall]);

// Mouse control
const mouse = Mouse.create(canvas);
const mouseConstraint = MouseConstraint.create(engine, {
  mouse: mouse,
  constraint: { stiffness: 0.2, render: { visible: false } }
});
World.add(world, mouseConstraint);

// Helper: random color
function randomColor() {
  return '#' + Math.floor(Math.random()*16777215).toString(16);
}

// Add objects
function addBox() {
  const box = Bodies.rectangle(Math.random()*canvas.width, 50, 50, 50, {
    restitution: parseFloat(document.getElementById('restitutionSlider').value),
    render: { fillStyle: randomColor() }
  });
  World.add(world, box);
}

function addBall() {
  const ball = Bodies.circle(Math.random()*canvas.width, 50, 25, {
    restitution: parseFloat(document.getElementById('restitutionSlider').value),
    render: { fillStyle: randomColor() }
  });
  World.add(world, ball);
}

function addTriangle() {
  const triangle = Bodies.polygon(Math.random()*canvas.width, 50, 3, 40, {
    restitution: parseFloat(document.getElementById('restitutionSlider').value),
    render: { fillStyle: randomColor() }
  });
  World.add(world, triangle);
}

function addPolygon() {
  const sides = Math.floor(Math.random() * 5) + 5; // 5-9 sides
  const polygon = Bodies.polygon(Math.random()*canvas.width, 50, sides, 30, {
    restitution: parseFloat(document.getElementById('restitutionSlider').value),
    render: { fillStyle: randomColor() }
  });
  World.add(world, polygon);
}

// Reset scene
function resetScene() {
  World.clear(world, false);
  World.add(world, [ground, leftWall, rightWall, mouseConstraint]);
}

// Toggle wireframes
function toggleWireframes() {
  render.options.wireframes = !render.options.wireframes;
}

// Gravity control
document.getElementById('gravitySlider').addEventListener('input', (e) => {
  engine.world.gravity.y = parseFloat(e.target.value);
});

// Resize canvas dynamically
window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  Render.lookAt(render, { min: { x: 0, y: 0 }, max: { x: canvas.width, y: canvas.height } });
  Matter.Body.setPosition(ground, { x: canvas.width/2, y: canvas.height-20 });
  Matter.Body.setPosition(leftWall, { x: -20, y: canvas.height/2 });
  Matter.Body.setPosition(rightWall, { x: canvas.width+20, y: canvas.height/2 });
});
</script>
</body>
</html>
