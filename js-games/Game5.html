<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super 3D Sandbox</title>
<style>
body { margin:0; overflow:hidden; background:#87ceeb; font-family:sans-serif; }
canvas { display:block; }
#instructions {
  position: fixed; top: 10px; left: 10px;
  background: rgba(0,0,0,0.5); color: white;
  padding: 10px 15px; border-radius: 6px; max-width:300px;
}
#inventory {
  position: fixed; bottom: 20px; left:50%; transform: translateX(-50%);
  display:flex; gap:10px;
}
.block-slot {
  width:40px; height:40px; border:2px solid white;
  display:flex; align-items:center; justify-content:center;
  font-weight:bold; cursor:pointer; background:rgba(0,0,0,0.5);
}
.block-slot.selected { border-color: yellow; }
</style>
</head>
<body>
<div id="instructions">
<strong>Controls:</strong><br>
Move: W A S D<br>
Look: Arrow Keys / Mouse<br>
Jump: Space<br>
Place Block: Left Click<br>
Remove Block: Right Click<br>
Switch Block: 1–6<br>
(Esc to release mouse)
</div>
<div id="inventory"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// --- Scene & Camera ---
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,2,5);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// --- Lighting ---
const ambient = new THREE.AmbientLight(0xffffff,0.6);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffffff,0.8);
sun.position.set(100,200,100);
sun.castShadow = true;
scene.add(sun);

// --- Ground ---
const loader = new THREE.TextureLoader();
const groundTexture = loader.load('https://threejsfundamentals.org/threejs/resources/images/grasslight-big.jpg');
groundTexture.wrapS = groundTexture.wrapT = THREE.RepeatWrapping;
groundTexture.repeat.set(50,50);
const groundMat = new THREE.MeshLambertMaterial({map:groundTexture});
const groundGeo = new THREE.PlaneGeometry(1000,1000);
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// --- Block Types ---
const blockTypes = [
  {name:"Grass", texture:'https://threejsfundamentals.org/threejs/resources/images/grasslight-big.jpg'},
  {name:"Dirt", texture:'https://threejsfundamentals.org/threejs/resources/images/dirt.jpg'},
  {name:"Stone", texture:'https://threejsfundamentals.org/threejs/resources/images/stone.jpg'},
  {name:"Wood", texture:'https://threejsfundamentals.org/threejs/resources/images/wood.jpg'},
  {name:"Sand", texture:'https://threejsfundamentals.org/threejs/resources/images/sand.jpg'},
  {name:"Brick", texture:'https://threejsfundamentals.org/threejs/resources/images/brick.jpg'}
];

// --- Inventory UI ---
let selectedBlock = 0;
const inventoryDiv = document.getElementById('inventory');
blockTypes.forEach((b,i)=>{
  const slot = document.createElement('div');
  slot.className='block-slot'+(i===0?' selected':'');
  slot.textContent=i+1;
  inventoryDiv.appendChild(slot);
  slot.onclick = ()=>{selectedBlock=i; updateInventory();}
});
function updateInventory(){
  document.querySelectorAll('.block-slot').forEach((s,i)=>{
    s.classList.toggle('selected', i===selectedBlock);
  });
}

// --- Blocks Storage ---
const blocks = [];
const blockGeo = new THREE.BoxGeometry(2,2,2);
function addBlock(pos,typeIndex){
  const tex = loader.load(blockTypes[typeIndex].texture);
  tex.flipY = false;
  const mat = new THREE.MeshLambertMaterial({map:tex});
  const block = new THREE.Mesh(blockGeo, mat);
  block.position.copy(pos);
  block.castShadow = true;
  block.receiveShadow = true;
  scene.add(block);
  blocks.push({mesh:block,type:typeIndex});
  saveWorld();
}

// --- Ghost Block ---
let ghostBlock = new THREE.Mesh(blockGeo,new THREE.MeshBasicMaterial({color:0xffffff,opacity:0.5,transparent:true}));
scene.add(ghostBlock);

// --- Raycaster ---
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2(0,0);

// --- Pointer lock ---
let pointerLocked=false;
document.body.addEventListener('click',()=>{if(!pointerLocked) renderer.domElement.requestPointerLock();});
document.addEventListener('pointerlockchange',()=>{pointerLocked=document.pointerLockElement===renderer.domElement;});

// --- Controls ---
let moveForward=false,moveBackward=false,moveLeft=false,moveRight=false;
let yaw=0,pitch=0;
const velocity = new THREE.Vector3();
const direction = new THREE.Vector3();
const movementSpeed = 15;
let canJump=true, yVelocity=0, gravity=-30;

document.addEventListener('mousemove', e=>{
  if(!pointerLocked) return;
  yaw -= e.movementX*0.002;
  pitch -= e.movementY*0.002;
  pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
});
window.addEventListener('keydown', e=>{
  switch(e.key.toLowerCase()){
    case "w": moveForward=true; break;
    case "s": moveBackward=true; break;
    case "a": moveLeft=true; break;
    case "d": moveRight=true; break;
    case " ": if(canJump){yVelocity=10; canJump=false;} break;
    case "1": selectedBlock=0; updateInventory(); break;
    case "2": selectedBlock=1; updateInventory(); break;
    case "3": selectedBlock=2; updateInventory(); break;
    case "4": selectedBlock=3; updateInventory(); break;
    case "5": selectedBlock=4; updateInventory(); break;
    case "6": selectedBlock=5; updateInventory(); break;
  }
});
window.addEventListener('keyup', e=>{
  switch(e.key.toLowerCase()){
    case "w": moveForward=false; break;
    case "s": moveBackward=false; break;
    case "a": moveLeft=false; break;
    case "d": moveRight=false; break;
  }
});

// --- Place/Remove blocks ---
window.addEventListener('mousedown', e=>{
  if(e.button===0) placeBlock();
  if(e.button===2) removeBlock();
});
window.addEventListener('contextmenu', e=>e.preventDefault());

function placeBlock(){
  raycaster.setFromCamera(mouse,camera);
  const intersects = raycaster.intersectObjects(blocks.map(b=>b.mesh));
  let pos = new THREE.Vector3();
  if(intersects.length>0) pos.copy(intersects[0].point).add(intersects[0].face.normal);
  else { const dir = new THREE.Vector3(); camera.getWorldDirection(dir); pos.copy(camera.position).add(dir.multiplyScalar(5)); }
  pos.x = Math.round(pos.x/2)*2; pos.y = Math.round(pos.y/2)*2; pos.z = Math.round(pos.z/2)*2;
  addBlock(pos,selectedBlock);
}
function removeBlock(){
  raycaster.setFromCamera(mouse,camera);
  const intersects = raycaster.intersectObjects(blocks.map(b=>b.mesh));
  if(intersects.length>0){
    const b = intersects[0].object;
    scene.remove(b);
    const idx = blocks.findIndex(x=>x.mesh===b);
    if(idx>=0) blocks.splice(idx,1);
    saveWorld();
  }
}

// --- Collision ---
function checkCollision(pos){
  for(const b of blocks){
    const dx=Math.abs(pos.x-b.mesh.position.x);
    const dz=Math.abs(pos.z-b.mesh.position.z);
    const dy=pos.y-b.mesh.position.y;
    if(dx<2 && dz<2 && dy<2 && dy>-2) return b.mesh.position.y+2;
  }
  return null;
}

// --- Animate ---
const clock = new THREE.Clock();
function animate(){
  const delta = clock.getDelta();
  direction.set(0,0,0);
  if(moveForward) direction.z-=1;
  if(moveBackward) direction.z+=1;
  if(moveLeft) direction.x-=1;
  if(moveRight) direction.x+=1;
  direction.normalize();

  const forward = new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));
  const right = new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  const moveX = (right.x*direction.x+forward.x*direction.z)*movementSpeed*delta;
  const moveZ = (right.z*direction.x+forward.z*direction.z)*movementSpeed*delta;

  // X movement
  let nextPos = camera.position.clone(); nextPos.x += moveX;
  let top = checkCollision(nextPos);
  if(top===null || nextPos.y>top) camera.position.x = nextPos.x;
  else if(top-camera.position.y<=2){camera.position.x=nextPos.x; camera.position.y=top; yVelocity=0; canJump=true;}

  // Z movement
  nextPos = camera.position.clone(); nextPos.z += moveZ;
  top = checkCollision(nextPos);
  if(top===null || nextPos.y>top) camera.position.z=nextPos.z;
  else if(top-camera.position.y<=2){camera.position.z=nextPos.z; camera.position.y=top; yVelocity=0; canJump=true;}

  // Gravity
  yVelocity += gravity*delta;
  nextPos = camera.position.clone(); nextPos.y += yVelocity*delta;
  top = checkCollision(nextPos);
  if(nextPos.y<2){yVelocity=0; camera.position.y=2; canJump=true;}
  else if(top!==null && nextPos.y<=top){yVelocity=0; camera.position.y=top; canJump=true;}
  else camera.position.y=nextPos.y;

  // Ghost block
  raycaster.setFromCamera(mouse,camera);
  const intBlocks = raycaster.intersectObjects(blocks.map(b=>b.mesh).concat([ground]));
  if(intBlocks.length>0){
    ghostBlock.position.copy(intBlocks[0].point).add(intBlocks[0].face.normal);
    ghostBlock.position.x=Math.round(ghostBlock.position.x/2)*2;
    ghostBlock.position.y=Math.round(ghostBlock.position.y/2)*2;
    ghostBlock.position.z=Math.round(ghostBlock.position.z/2)*2;
    ghostBlock.visible=true;
  } else ghostBlock.visible=false;

  camera.rotation.order="YXZ";
  camera.rotation.y=yaw; camera.rotation.x=pitch;

  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();

// --- Day-Night Cycle ---
let sunAngle=0;
setInterval(()=>{
  sunAngle+=0.01;
  sun.position.set(Math.cos(sunAngle)*100,Math.sin(sunAngle)*200,100);
  scene.background = new THREE.Color().setHSL(0.6,0.7,Math.max(0.2,Math.sin(sunAngle)*0.5+0.5));
},50);

// --- World Save/Load ---
function saveWorld(){
  const worldData = blocks.map(b=>({pos:b.mesh.position,type:b.type}));
  localStorage.setItem('sandboxWorld',JSON.stringify(worldData));
}
function loadWorld(){
  const data = JSON.parse(localStorage.getItem('sandboxWorld')||'[]');
  for(const b of data) addBlock(new THREE.Vector3(b.pos.x,b.pos.y,b.pos.z),b.type);
}
loadWorld();

// --- Resize ---
window.addEventListener("resize",()=>{camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight);});
</script>
</body>
</html>
